# Production deployment on the Oracle VM.
#
# This is a standalone production stack. Its PostgreSQL and Redis services
# are intentionally isolated from any other applications on the VM.
#
# Configure env/.env.prod with POSTGRES_USER, POSTGRES_PASSWORD, and
# POSTGRES_DB for the isolated database, then use the Compose service names:
# DATABASE_URL=postgres://...@postgres:5432/...
# REDIS_URL=redis://redis:6379
#
# Database migrations are intentionally not Compose services in production.
# Apply them separately as an explicit release operation when the database
# schema is new or migrations have changed. Nginx on the VM terminates TLS
# and proxies to the published gateway/test-runner loopback ports.
#
# Usage: `make deploy` (see Makefile), or:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./env/.env.prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    env_file: ./env/.env.prod
    environment:
      APP_ENV: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4051/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  orders-service:
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    restart: unless-stopped
    env_file: ./env/.env.prod
    environment:
      APP_ENV: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4052/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  payments-service:
    build:
      context: .
      dockerfile: services/payments-service/Dockerfile
    restart: unless-stopped
    env_file: ./env/.env.prod
    environment:
      APP_ENV: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4053/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    env_file: ./env/.env.prod
    environment:
      APP_ENV: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4050:4050"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4050/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-runner-service:
    build:
      context: .
      dockerfile: services/test-runner-service/Dockerfile
    restart: unless-stopped
    env_file: ./env/.env.prod
    environment:
      APP_ENV: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4054:4054"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4054/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  redis_prod_data:

