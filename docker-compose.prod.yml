# Production deployment on the Oracle VM.
#
# This is a SEPARATE, standalone compose file rather than an overlay on
# docker-compose.yml, on purpose: it deliberately does NOT define
# `postgres` or `redis` services, since those already run on the VM
# outside Docker Compose. Keeping two explicit files is simpler to reason
# about than fighting Compose's merge/profile semantics to conditionally
# exclude services - see docs/implementation-plan.md section 5.
#
# Point env/.env.prod's DATABASE_URL/REDIS_URL at wherever your existing
# Postgres/Redis actually listen. `host.docker.internal` (mapped below via
# extra_hosts) is a reasonable default if they run directly on the VM host;
# if they instead run in their own Docker network, connect this project's
# network to that one and use its service name instead.
#
# Database migrations are intentionally not Compose services in production.
# Apply them separately as an explicit release operation when the database
# schema is new or migrations have changed. Nginx on the VM terminates TLS
# and proxies to the published gateway/test-runner loopback ports.
#
# Usage: `make deploy` (see Makefile), or:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    env_file: ./env/.env.prod
    environment:
      APP_ENV: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4051/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  orders-service:
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    restart: unless-stopped
    env_file: ./env/.env.prod
    environment:
      APP_ENV: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4052/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  payments-service:
    build:
      context: .
      dockerfile: services/payments-service/Dockerfile
    restart: unless-stopped
    env_file: ./env/.env.prod
    environment:
      APP_ENV: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4053/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    env_file: ./env/.env.prod
    environment:
      APP_ENV: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4050:4050"
    depends_on:
      auth-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4050/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-runner-service:
    build:
      context: .
      dockerfile: services/test-runner-service/Dockerfile
    restart: unless-stopped
    env_file: ./env/.env.prod
    environment:
      APP_ENV: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4054:4054"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4054/health"]
      interval: 10s
      timeout: 5s
      retries: 5

